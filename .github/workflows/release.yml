name: Publish Homebrew release
run-name: Homebrew ${{ inputs.version }} / ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published GOX version (empty selects latest)
        type: string
        default: ''
      request_id:
        description: Distribution run identifier
        type: string
        default: manual
permissions:
  contents: read
concurrency:
  group: homebrew-publication
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release
        uses: gox-lang/server/.github/actions/release-info@main
        with:
          version: ${{ inputs.version }}
  validate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release
        uses: gox-lang/server/.github/actions/release-info@main
        with:
          version: ${{ needs.resolve.outputs.version }}
      - name: Update tested formula
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHECKSUMS: ${{ steps.release.outputs.checksums }}
        run: node maintenance/update-formula.cjs
      - name: Publish formula
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/gox.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update GOX to $VERSION"
            git push origin HEAD:main
          fi
          echo "Homebrew now points to GOX $VERSION, with all four installation checks passed." >> "$GITHUB_STEP_SUMMARY"
