name: Homebrew installation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@2026.10.19.1
      - name: Register local tap
        run: |
          tap="$(brew --repository)/Library/Taps/gox-lang/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          if [ ! -e "$tap" ]; then
            ln -s "$GITHUB_WORKSPACE" "$tap"
          fi
      - name: Install from GitHub Releases
        run: brew install --formula gox-lang/tap/gox
      - name: Test installed command and update policy
        run: brew test gox-lang/tap/gox
      - name: Compile and serve a new project
        shell: bash
        run: |
          export GOX_HOME="$RUNNER_TEMP/gox-toolchains"
          cd "$RUNNER_TEMP"
          gox createproject smoke-project
          cd smoke-project
          gox run --host 127.0.0.1 --port 3187 > "$RUNNER_TEMP/gox-run.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:3187/ > "$RUNNER_TEMP/gox-page.html"; then
              grep -qi 'hello.*gox' "$RUNNER_TEMP/gox-page.html"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/gox-run.log"
              exit 1
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/gox-run.log"
          exit 1
      - name: Verify uninstall
        run: brew uninstall gox-lang/tap/gox
